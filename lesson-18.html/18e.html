<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>send the request to Amazon</title>
</head>
<body>
  
    <script>
       async function sendreqamz(){

        try{
            const response = await fetch('https://www.amazon.com' , {
            'method' : 'GET',
        })

        const data = await response.text();
        console.log(data);

        }catch(error){
            console.log('CORS error. Your request was blocked by backend');
        }

    }

    sendreqamz();
    </script>
</body>
</html>
